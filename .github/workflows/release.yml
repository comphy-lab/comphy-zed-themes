name: Release Zed Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag at the selected master commit (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zed-registry-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use an exact vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          tagged_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$tagged_sha" != "$RELEASE_SHA" || "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::The tag must point to the exact default-branch commit selected for this run."
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("extension.toml", "rb"))["version"])')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::The release tag must match the version in extension.toml."
            exit 1
          fi

  release:
    name: Release Zed Extension
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    environment: zed-registry-production
    steps:
      - uses: huacnlee/zed-extension-action@6a168731f1d994905eeb552b3b42b0cb6c4d12e6 # v1.0.0
        with:
          extension-name: comphy-crisp-themes
          push-to: comphy-lab/extensions
          tag-name: ${{ inputs.tag }}
          commit-message: |
            Update {{extensionName}} to v{{version}}

            Release notes:

            https://github.com/{{owner}}/{{repo}}/releases/tag/v{{version}}

            > Created by [zed-extension-action](https://github.com/huacnlee/zed-extension-action).
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_REGISTRY_RELEASE_TOKEN }}
